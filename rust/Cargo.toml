# Created by sdk-kit 0.1.0; owned by this repository (keep the category features).
[package]
name = "grow-aws-cloudwatch-logs"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
# MSRV-aware dependency resolution (picks versions that still build on rust-version).
resolver = "3"
description = "Rust SDK for Amazon CloudWatch Logs by Grow Codes"
authors = ["Grow Codes <opensource@grow.codes>"]
license = "Apache-2.0"
homepage = "https://grow-codes-packages.github.io/aws-cloudwatch-logs/"
repository = "https://github.com/grow-codes-packages/aws-cloudwatch-logs"
documentation = "https://docs.rs/grow-aws-cloudwatch-logs"
readme = "README.md"
keywords = ["grow-codes", "aws", "cloudwatch", "logs", "sdk"]
categories = ["api-bindings", "asynchronous"]
include = ["src/**/*.rs", "Cargo.toml", "README.md", "LICENSE", "NOTICE"]

[lib]
name = "grow_aws_cloudwatch_logs"
path = "src/lib.rs"

[features]
default = ["tracing-layer", "log-bridge"]
# Blocking wrapper (`blocking::CloudWatchLogsClient`) that owns a current-thread tokio runtime.
blocking = []
# In-memory fakes and the conformance runner (`testing` module).
testing = []
# `tracing_subscriber::Layer` that forwards tracing events to a `LogClient` (`LogLayer`).
tracing-layer = []
# `log::Log` implementation that forwards `log` records to a `LogClient` (`LogBridge`).
log-bridge = ["dep:log"]

[dependencies]
async-trait = "0.1.80"
# Official AWS SDK (SPEC §2.3 "Cloud SDK services"). No default features: the HTTP client is the
# crate's own reqwest connector (TLS, proxy, hooks), so no second TLS stack is pulled in.
aws-config = { version = "1.5", default-features = false, features = ["rt-tokio", "behavior-version-latest", "sso", "credentials-process"] }
aws-credential-types = "1.2"
aws-sdk-cloudwatchlogs = { version = "1.60", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }
aws-sdk-sts = { version = "1.50", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }
aws-smithy-runtime-api = { version = "1.7", features = ["client", "http-1x"] }
aws-smithy-types = { version = "1.2", features = ["http-body-1-x"] }
base64 = "0.22"
bytes = "1.6"
futures = { version = "0.3.30", default-features = false, features = ["std", "async-await"] }
httpdate = "1.0"
rand = { version = "0.9", default-features = false, features = ["std", "thread_rng"] }
reqwest = { version = "0.12.9", default-features = false, features = ["rustls-tls-native-roots", "json", "gzip"] }
serde = { version = "1.0.200", features = ["derive"] }
serde_json = "1.0.120"
sha2 = "0.10.8"
tokio = { version = "1.43", features = ["rt", "rt-multi-thread", "time", "sync", "macros"] }
tokio-util = { version = "0.7.11", default-features = false }
tracing = { version = "0.1.40", default-features = false, features = ["std", "attributes"] }
url = "2.5"
zeroize = { version = "1.8", features = ["zeroize_derive"] }
tracing-subscriber = { version = "0.3.18", default-features = false, features = ["std", "registry", "fmt"] }
opentelemetry = { version = "0.31", default-features = false, features = ["trace"] }
log = { version = "0.4.22", optional = true, features = ["std", "kv"] }
flate2 = "1.0.30"
regex = "1.10"
humantime = "2.1"

[dev-dependencies]
tokio = { version = "1.43", features = ["rt-multi-thread", "macros", "time", "sync", "test-util"] }
wiremock = "0.6"
aws-smithy-eventstream = "0.60"
bytes = "1.6"
http-body-1 = { package = "http-body", version = "1" }
http-body-util = "0.1"
tracing-subscriber = { version = "0.3.18", default-features = false, features = ["std", "fmt", "registry"] }
serde_json = "1.0.120"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(docsrs)', 'cfg(coverage_nightly)'] }

[lints.clippy]
all = { level = "warn", priority = -1 }
